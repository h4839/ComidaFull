<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comida Full - Publicar Excedente</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="container">
        <h2>Publicar Excedente de Comida</h2>
        <p>Completa la información del alimento que deseas donar hoy.</p>
        
        <form id="form-excedente">
            <label for="tipo_alimento">Tipo de alimento / Descripción:</label>
            <input type="text" id="tipo_alimento" placeholder="Ej. Guisado de pollo con verduras *" required>

            <label for="cantidad">Cantidad:</label>
            <input type="number" step="0.1" id="cantidad" placeholder="Ej. 15 *" required>

            <label for="unidad">Unidad de medida:</label>
            <select id="unidad" required>
                <option value="kg">Kilogramos (kg)</option>
                <option value="porciones">Porciones / Platillos</option>
                <option value="piezas">Piezas</option>
                <option value="litros">Litros</option>
            </select>

            <label for="fecha_caducidad">Fecha de consumo recomendado / caducidad:</label>
            <input type="date" id="fecha_caducidad" required>

            <label for="hora_limite">Hora límite para recoger:</label>
            <input type="time" id="hora_limite" required>

            <label for="foto_url">URL de la foto de la comida (Opcional):</label>
            <input type="url" id="foto_url" placeholder="https://ejemplo.com/foto.jpg">

            <button type="submit">Publicar Alimento</button>
        </form>

        <p id="mensaje-excedente"></p>

        <p style="margin-top: 15px;">
            <a href="login.html" id="btn-cerrar-sesion">Cerrar Sesión</a>
        </p>
    </div>

    <!-- 1. Librería Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 2. Configuración de cliente -->
    <script src="js/supabase-config.js"></script>
    <!-- 3. Lógica del módulo -->
    <script src="js/publicar.js"></script>
</body>
</html>
